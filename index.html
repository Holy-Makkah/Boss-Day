<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صانع بطاقات التهنئة</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        
        /* تعريف ملف الخط الخاص بك */
        @font-face {
            font-family: 'MyCustomFont';
            src: url('LyonArabicDisplay-Light-App.ttf') format('truetype');
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #e6ded4; 
        }
        .preview-card, .template-card {
            background: #fffdf9;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            transition: all 0.3s ease;
        }
        .template-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 50px rgba(181, 141, 67, 0.15);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 md:p-8">

    <!-- ================== الهيدر المشترك ================== -->
    <header class="w-full max-w-4xl flex justify-center mb-6 pt-2">
        <img src="logo.png" alt="شعار الموقع" class="h-8 w-auto object-contain opacity-90 transition-opacity hover:opacity-100">
    </header>

    <!-- ================== الشاشة الأولى: معرض اختيار القوالب ================== -->
    <div id="gallery-screen" class="w-full max-w-4xl my-auto text-center py-6">
        <h1 class="text-3xl md:text-4xl font-black text-[#1f160e] mt-2 mb-2">يوم المدير العالمي</h1>
        <p class="text-xs md:text-sm text-gray-600 mb-8 max-w-md mx-auto leading-relaxed">
            بارك لمديرك واصنع بطاقة لتهنئته
        </p>

        <!-- شبكة القوالب المصغرة -->
        <div class="flex flex-wrap justify-center gap-6 px-4">            
            <div class="template-card p-4 border border-white/40 flex flex-col items-center">
                <div class="w-full aspect-[9/16] h-[340px] rounded-xl overflow-hidden bg-slate-900/10 mb-4 border border-gray-100 flex items-center justify-center">
                    <img src="boss.jpg" alt="قالب تهنئة للمدير " class="w-full h-full object-contain">
                </div>
                <h3 class="font-bold text-sm text-[#1f160e] mb-3">قالب تهنئة للمدير </h3>
                <!-- لون النص الممرر -->
                <button onclick="selectTemplate('boss.jpg', '#30261b')" class="w-full bg-[#b58d43] hover:bg-[#9c7634] text-white text-xs font-bold py-2.5 rounded-xl transition shadow-md">
                    اختر هذا القالب
                </button>
            </div>
        </div>
    </div>


    <!-- ================== الشاشة الثانية: شاشة التصميم والتعديل ================== -->
    <div id="design-screen" class="w-full max-w-5xl flex flex-col lg:flex-row gap-6 items-center lg:items-stretch justify-center my-auto hidden">
        
        <!-- القسم الأيسر: المعاينة الحية -->
        <div class="w-full max-w-[340px] flex flex-col items-center">
            <div class="preview-card p-3 w-full border border-white/40">
                <div id="card-container" class="relative w-full aspect-[9/16] rounded-xl overflow-hidden shadow-lg border border-gray-200 bg-white">                    
                    <svg id="card-svg" viewBox="0 0 640 1136" class="w-full h-auto block" xmlns="http://www.w3.org/2000/svg">
                        <image id="svg-template-img" href="" width="640" height="1136" x="0" y="0" preserveAspectRatio="xMidYMid meet" crossorigin="anonymous"/>
                        
                        <!-- النص الأول: اسم المدير (محاذاة لليمين باستخدام text-anchor="end") -->
                        <text id="svg-boss-name" x="450" y="900" text-anchor="end" fill="" font-size="19" style="font-family: 'MyCustomFont', 'Cairo', sans-serif;" font-weight="900">اكتب اسم مديرك</text>
                        
                        <!-- النص الثاني: اسمك (محاذاة لليمين باستخدام text-anchor="end") -->
                        <text id="svg-sender-name" x="450" y="940" text-anchor="end" fill="" font-size="19" style="font-family: 'MyCustomFont', 'Cairo', sans-serif;" font-weight="900">اكتب اسمك</text>
                    </svg>
                </div>
            </div>
        </div>

        <!-- القسم الأيمن: لوحة التحكم بالتصميم -->
        <div class="w-full max-w-[400px] bg-[#fffdf9]/95 backdrop-blur-md rounded-3xl p-6 shadow-xl border border-white/60 flex flex-col justify-between">
            <div>
                <button id="btn-back-to-gallery" class="text-xs font-bold text-amber-700 bg-amber-100 hover:bg-amber-200 px-3 py-1.5 rounded-full w-max block mb-4 transition">
                    ← العودة لاختيار قالب آخر
                </button>
                
                <h1 class="text-2xl font-black text-[#1f160e] leading-tight mb-2">
                    خصص بطاقة التهنئة
                </h1>
                
                <p class="text-xs text-gray-600 mb-6 leading-relaxed">
                    أدخل اسم مديرك واسمك بالأسفل ليظهروا على البطاقة بالخط المخصص.
                </p>
                
                <!-- حقل اسم المدير -->
                <div class="mb-4">
                    <label for="boss-input" class="block text-xs font-bold text-gray-700 mb-1">اسم المدير</label>
                    <input type="text" id="boss-input" value="اكتب اسم مديرك" class="w-full px-3 py-2 bg-white border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-600 text-sm font-medium transition">
                </div>

                <!-- حقل اسمك (المرسل) -->
                <div class="mb-4">
                    <label for="sender-input" class="block text-xs font-bold text-gray-700 mb-1">اسمك (المرسل)</label>
                    <input type="text" id="sender-input" value="اكتب اسمك" class="w-full px-3 py-2 bg-white border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-600 text-sm font-medium transition">
                </div>
            </div>

            <!-- زر التجهيز والانتقال لصفحة الحفظ -->
            <div class="space-y-2 mt-2">
                <button id="btn-generate" class="w-full bg-[#b58d43] hover:bg-[#9c7634] text-white text-sm font-bold py-4 rounded-xl transition shadow-md flex items-center justify-center gap-2">
                    تجهيز البطاقة للحفظ
                </button>
            </div>
        </div>
    </div>


    <!-- ================== الشاشة الثالثة: شاشة الحفظ الفوري ================== -->
    <div id="save-screen" class="w-full max-w-md flex flex-col items-center justify-center my-auto hidden">
        <div class="bg-[#fffdf9] rounded-3xl p-6 shadow-2xl border border-white/60 w-full text-center">
            
            <span class="text-3xl">🎉</span>
            <h2 class="text-xl font-black text-[#1f160e] mt-2 mb-1">تمت صناعة بطاقتك بنجاح!</h2>
            <p class="text-xs text-emerald-700 font-bold mb-4 bg-emerald-50 py-1.5 px-3 rounded-full inline-block">
                📱 اضغط مطولاً على الصورة بالأسفل لحفظها في جهازك
            </p>

            <!-- الصورة النهائية المدمجة -->
            <div class="relative w-full max-w-[280px] mx-auto rounded-2xl overflow-hidden shadow-lg border border-gray-200 mb-6">
                <img id="final-card-img" src="" alt="بطاقة تهنئة المدير" class="w-full h-auto block select-none">
            </div>

            <!-- أزرار التحكم بالرجوع -->
            <div class="space-y-2">
                <button id="btn-back-to-design" class="w-full bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold py-3 rounded-xl transition">
                    ← العودة وتعديل الأسماء
                </button>
            </div>
        </div>
    </div>

    <!-- الجافا سكريبت -->
    <script>
        const galleryScreen = document.getElementById('gallery-screen');
        const designScreen = document.getElementById('design-screen');
        const saveScreen = document.getElementById('save-screen');
        
        const svgTemplateImg = document.getElementById('svg-template-img');
        
        const bossInput = document.getElementById('boss-input');
        const svgBossName = document.getElementById('svg-boss-name');

        const senderInput = document.getElementById('sender-input');
        const svgSenderName = document.getElementById('svg-sender-name');
        
        const btnBackToGallery = document.getElementById('btn-back-to-gallery');
        const btnGenerate = document.getElementById('btn-generate');
        const btnBackToDesign = document.getElementById('btn-back-to-design');
        const finalCardImg = document.getElementById('final-card-img');

        let currentSelectedTemplatePath = '';
        let currentSelectedTemplateColor = '#30261b'; 

        // إحداثيات الإحداث والارتفاع للنصين (محاذاة يمين عند X=450)
        const BOSS_X = 137;
        const BOSS_Y = 890; 

        const SENDER_X = 200;
        const SENDER_Y = 930;

        function selectTemplate(imgName, textColor) {
            currentSelectedTemplatePath = imgName;
            currentSelectedTemplateColor = textColor || '#30261b'; 
            
            svgTemplateImg.setAttribute('href', imgName);
            
            svgBossName.setAttribute('fill', currentSelectedTemplateColor);
            svgBossName.setAttribute('x', BOSS_X);
            svgBossName.setAttribute('y', BOSS_Y);

            svgSenderName.setAttribute('fill', currentSelectedTemplateColor);
            svgSenderName.setAttribute('x', SENDER_X);
            svgSenderName.setAttribute('y', SENDER_Y);
            
            galleryScreen.classList.add('hidden');
            designScreen.classList.remove('hidden');
        }

        btnBackToGallery.addEventListener('click', () => {
            designScreen.classList.add('hidden');
            galleryScreen.classList.remove('hidden');
        });

        // ربط مدخل اسم المدير بالمعاينة الحية
        bossInput.addEventListener('input', () => {
            svgBossName.textContent = bossInput.value.trim() || "اكتب اسم مديرك";
        });

        // ربط مدخل اسمك بالمعاينة الحية
        senderInput.addEventListener('input', () => {
            svgSenderName.textContent = senderInput.value.trim() || "اكتب اسمك";
        });

        btnBackToDesign.addEventListener('click', () => {
            saveScreen.classList.add('hidden');
            designScreen.classList.remove('hidden');
        });

        // توليد الصورة النهائية في الـ Canvas وحفظها
        btnGenerate.addEventListener('click', () => {
            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 1136;
            const context = canvas.getContext('2d');

            const bgImg = new Image();
            bgImg.crossOrigin = 'anonymous'; 
            bgImg.src = currentSelectedTemplatePath; 

            bgImg.onload = () => {
                context.drawImage(bgImg, 0, 0, 640, 1136);
                context.textAlign = 'right'; // محاذاة النص لليمين في الكانفاس
                context.fillStyle = currentSelectedTemplateColor;

                // 1. رسم اسم المدير
                const bossText = bossInput.value.trim() || "اكتب اسم مديرك";
                context.font = `900 19px 'MyCustomFont', 'Cairo', sans-serif`;
                context.fillText(bossText, BOSS_X, BOSS_Y);

                // 2. رسم اسم المرسل (اسمك)
                const senderText = senderInput.value.trim() || "اكتب اسمك";
                context.font = `900 19px 'MyCustomFont', 'Cairo', sans-serif`;
                context.fillText(senderText, SENDER_X, SENDER_Y);

                // تحويل لنتيجة نهائية وعرضها
                const renderedDataUrl = canvas.toDataURL('image/png');
                finalCardImg.src = renderedDataUrl;

                designScreen.classList.add('hidden');
                saveScreen.classList.remove('hidden');
            };

            bgImg.onerror = () => {
                alert(`عذراً، تعذر العثور على ملف الصورة باسم ${currentSelectedTemplatePath} في مجلد المشروع.`);
            };
        });
    </script>
</body>
</html>
